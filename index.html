<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#101c30" />
  <meta name="description" content="An interactive web textbook for mathematics, statistics, econometrics, political science research, and game theory. Full lessons, worked exercises, visual experiments." />
  <title>QuantPol Math · Interactive Web Textbook</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
 <aside class="sidebar" id="sidebar">
  <div class="brand"><span class="brand-icon">∑</span><div><strong>QuantPol <em>Math</em></strong><small>Interactive Web Edition</small></div></div>
  <div class="searchbox"><input id="search" aria-label="Search chapters and resources" placeholder="Search chapters…" /></div>
  <nav id="navigation" aria-label="Course navigation"></nav>
  <div class="sidebar-bottom">Fourth Edition · October 2026<br><span>Native HTML · Your progress stays on this device</span></div>
 </aside>
 <div class="mainwrap">
  <header class="topbar"><button id="menu" class="menu" aria-label="Open navigation">☰</button><span id="breadcrumbs">Learning dashboard</span><div class="topright"><span id="progressLabel">Loading…</span><button class="small" id="themeToggle" title="Toggle theme">◐ Theme</button></div></header>
  <main id="view"><div class="panel">Loading the interactive textbook…</div></main>
 </div>
</div>
<dialog id="mathDialog" class="math-dialog" aria-label="Equation detail"><button class="dialogclose small" data-close-dialog aria-label="Close">✕ Close</button><div id="mathDialogContent"></div></dialog>
<script defer src="app.js"></script>
</body>
</html>
